services:
  - type: web
    name: agriadvisor
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_CACHE_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false